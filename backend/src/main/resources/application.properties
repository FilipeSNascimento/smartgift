spring.application.name=smartgift-backend
server.port=8080

# Perfil padrão: 'h2' (roda imediatamente em memória) ou troque para 'postgres' (PostgreSQL na porta 5432)
spring.profiles.active=${SMARTGIFT_PROFILE:h2}

# Configurações H2 (Fallback rápido de desenvolvimento)
spring.datasource.url=jdbc:h2:mem:smartgiftdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
