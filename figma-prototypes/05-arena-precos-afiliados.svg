<svg width="393" height="852" viewBox="0 0 393 852" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hudGrad" x1="0" y1="0" x2="0" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="btnGreen" x1="0" y1="0" x2="0" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="btnPurple" x1="0" y1="0" x2="0" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <g id="05-Tela-Arena-Precos-E-Afiliados">
    <rect id="Screen-Bg" width="393" height="852" rx="36" fill="#0F172A"/>

    <!-- LAYER: Top Search Header -->
    <g id="Arena-Header">
      <rect width="393" height="128" fill="url(#hudGrad)"/>
      <line x1="0" y1="128" x2="393" y2="128" stroke="#334155" stroke-width="2"/>

      <text x="20" y="42" fill="#FEF08A" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="15" font-weight="800">🔍 Arena Caça-Preços em Tempo Real</text>
      <text x="20" y="58" fill="#94A3B8" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="10" font-weight="600">API Mercado Livre + Comparador de Lojas c/ Afiliado</text>

      <!-- Live Search Input -->
      <g id="Live-Search-Bar" transform="translate(16, 70)">
        <rect width="268" height="42" rx="12" fill="#090D16" stroke="#38BDF8" stroke-width="1.5"/>
        <text x="14" y="26" fill="#F8FAFC" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="12" font-weight="600">PlayStation 5 Slim Digital</text>

        <rect x="276" y="3" width="85" height="39" rx="11" fill="#047857"/>
        <rect x="276" y="0" width="85" height="39" rx="11" fill="url(#btnGreen)"/>
        <text x="318" y="24" text-anchor="middle" fill="#FFFFFF" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="11" font-weight="900">BUSCAR ⚡</text>
      </g>
    </g>

    <!-- LAYER: Real Product Price Comparison Card -->
    <g id="Price-Comparison-Card-Main" transform="translate(16, 142)">
      <rect width="361" height="340" rx="20" fill="#1E293B" stroke="#10B981" stroke-width="2"/>

      <g id="Product-Summary-Row" transform="translate(14, 14)">
        <rect width="64" height="64" rx="14" fill="#0F172A"/>
        <text x="32" y="42" text-anchor="middle" font-size="30">🎮</text>
        <text x="88" y="18" fill="#F8FAFC" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="13" font-weight="800">Console PlayStation 5 Slim 1TB</text>
        <text x="88" y="36" fill="#34D399" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="11" font-weight="800">🔥 Economia real de R$ 650,00 (-16%)</text>
        <text x="88" y="54" fill="#94A3B8" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="10">Verificado agora via API Oficial</text>
      </g>

      <!-- Store 1: Cheapest Winner -->
      <g id="Offer-Row-1-Winner" transform="translate(14, 90)">
        <rect width="333" height="54" rx="12" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
        <text x="14" y="24" fill="#FFFFFF" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="12" font-weight="800">🤝 Mercado Livre Oficial</text>
        <rect x="164" y="11" width="66" height="16" rx="5" fill="#10B981"/>
        <text x="197" y="22" text-anchor="middle" fill="#090D16" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="8" font-weight="900">MAIS BARATO</text>
        <text x="14" y="41" fill="#A7F3D0" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="10">10x R$ 334,90 s/ juros • Frete Grátis Full</text>
        <text x="320" y="26" text-anchor="end" fill="#FEF08A" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="13" font-weight="900">R$ 3.349</text>
        <text x="320" y="42" text-anchor="end" fill="#6EE7B7" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="9" font-weight="800">Ir à loja ↗</text>
      </g>

      <!-- Store 2 -->
      <g id="Offer-Row-2" transform="translate(14, 152)">
        <rect width="333" height="50" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" fill="#F8FAFC" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="12" font-weight="700">📦 Amazon Brasil</text>
        <text x="14" y="38" fill="#94A3B8" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="10">10x R$ 349,90 s/ juros • Prime Grátis</text>
        <text x="320" y="24" text-anchor="end" fill="#F8FAFC" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="12" font-weight="800">R$ 3.499</text>
        <text x="320" y="39" text-anchor="end" fill="#A78BFA" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="9" font-weight="700">Tag Afiliado ↗</text>
      </g>

      <!-- Store 3 -->
      <g id="Offer-Row-3" transform="translate(14, 210)">
        <rect width="333" height="50" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" fill="#F8FAFC" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="12" font-weight="700">💥 KaBuM!</text>
        <text x="14" y="38" fill="#94A3B8" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="10">À vista no Pix ou 10x R$ 379,90</text>
        <text x="320" y="24" text-anchor="end" fill="#F8FAFC" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="12" font-weight="800">R$ 3.599</text>
        <text x="320" y="39" text-anchor="end" fill="#A78BFA" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="9" font-weight="700">Tag Afiliado ↗</text>
      </g>

      <!-- Add to My Deck CTA -->
      <g id="Btn-Add-From-Arena" transform="translate(14, 274)">
        <rect y="3" width="333" height="44" rx="12" fill="#4C1D95"/>
        <rect width="333" height="44" rx="12" fill="url(#btnPurple)"/>
        <text x="166" y="27" text-anchor="middle" fill="#FFFFFF" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="12" font-weight="900">🃏 ADICIONAR ESTA OFERTA AO MEU DECK</text>
      </g>
    </g>

    <!-- LAYER: Affiliate Monetization Configuration Panel -->
    <g id="Affiliate-Monetization-Box" transform="translate(16, 496)">
      <rect width="361" height="260" rx="20" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="16" y="26" fill="#FEF08A" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="13" font-weight="800">💰 Monetização &amp; IDs de Afiliado Ativos</text>
      <text x="16" y="42" fill="#CBD5E1" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="10">Todos os links de compra injetam automaticamente sua comissão:</text>

      <g id="Aff-Row-1" transform="translate(16, 56)">
        <rect width="329" height="40" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="12" y="24" fill="#94A3B8" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="11" font-weight="700">📦 Amazon Associados:</text>
        <text x="316" y="24" text-anchor="end" fill="#34D399" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="11" font-weight="800">?tag=smartgift-20</text>
      </g>

      <g id="Aff-Row-2" transform="translate(16, 104)">
        <rect width="329" height="40" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="12" y="24" fill="#94A3B8" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="11" font-weight="700">🤝 Mercado Livre Afiliados:</text>
        <text x="316" y="24" text-anchor="end" fill="#34D399" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="11" font-weight="800">matt_tool=smartgift_br</text>
      </g>

      <g id="Aff-Row-3" transform="translate(16, 152)">
        <rect width="329" height="40" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="12" y="24" fill="#94A3B8" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="11" font-weight="700">🧡 Shopee &amp; Magalu:</text>
        <text x="316" y="24" text-anchor="end" fill="#34D399" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="11" font-weight="800">af_siteid=smartgift</text>
      </g>

      <rect x="16" y="204" width="329" height="40" rx="10" fill="#064E3B"/>
      <text x="180" y="228" text-anchor="middle" fill="#6EE7B7" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="11" font-weight="800">✅ Links monetizados automaticamente em 100% dos Clãs</text>
    </g>

    <!-- LAYER: Clash Royale 5-Tab Bottom Dock -->
    <g id="Clash-Bottom-Dock" transform="translate(0, 774)">
      <rect width="393" height="78" fill="#090D16"/>
      <line x1="0" y1="0" x2="393" y2="0" stroke="#334155" stroke-width="2"/>
      <g id="Tab-1-Feed" transform="translate(10, 8)">
        <text x="35" y="28" text-anchor="middle" font-size="18">📸</text>
        <text x="35" y="46" text-anchor="middle" fill="#94A3B8" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="10" font-weight="700">Feed</text>
      </g>
      <g id="Tab-2-Deck" transform="translate(86, 8)">
        <text x="35" y="28" text-anchor="middle" font-size="18">🃏</text>
        <text x="35" y="46" text-anchor="middle" fill="#94A3B8" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="10" font-weight="700">Meu Deck</text>
      </g>
      <g id="Tab-3-Clans" transform="translate(161, 8)">
        <text x="35" y="28" text-anchor="middle" font-size="18">🏰</text>
        <text x="35" y="46" text-anchor="middle" fill="#94A3B8" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="10" font-weight="700">Clãs &amp; Baú</text>
      </g>
      <g id="Tab-4-Arena-Active" transform="translate(237, 8)">
        <rect width="70" height="56" rx="14" fill="#7C3AED" fill-opacity="0.32" stroke="#A78BFA" stroke-width="1.5"/>
        <text x="35" y="28" text-anchor="middle" font-size="18">🔍</text>
        <text x="35" y="46" text-anchor="middle" fill="#FEF08A" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="10" font-weight="800">Lojas</text>
      </g>
      <g id="Tab-5-Profile" transform="translate(313, 8)">
        <text x="35" y="28" text-anchor="middle" font-size="18">⚙️</text>
        <text x="35" y="46" text-anchor="middle" fill="#94A3B8" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="10" font-weight="700">Perfil</text>
      </g>
    </g>
  </g>
</svg>